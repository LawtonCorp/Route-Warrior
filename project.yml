# XcodeGen project definition. The .xcodeproj is generated rather than committed
# so the project file never becomes a merge-conflict battleground; run
# ./scripts/bootstrap.sh (or `xcodegen generate`) to produce it.
#
# Signing is deliberately OFF here. CI builds unsigned, and no developer account
# ever reaches the repository. Device builds get their team from
# scripts/device-build.sh, which passes DEVELOPMENT_TEAM on the xcodebuild
# command line. Never put a team into this file.
name: StarterApp
options:
  bundleIdPrefix: com.lawtoncorp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  StarterKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  StarterApp:
    type: application
    platform: iOS
    sources:
      - path: App/StarterApp
    dependencies:
      - package: StarterKit
        product: StarterKit
    info:
      path: App/StarterApp/Info.plist
      properties:
        CFBundleDisplayName: StarterApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lawtoncorp.starterapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  StarterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/StarterAppTests
    dependencies:
      - target: StarterApp

schemes:
  StarterApp:
    build:
      targets:
        StarterApp: all
    test:
      targets:
        - StarterAppTests
