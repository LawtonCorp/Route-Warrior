# XcodeGen project definition. The .xcodeproj is generated rather than committed
# so the project file never becomes a merge-conflict battleground; run
# ./scripts/bootstrap.sh (or `xcodegen generate`) to produce it.
#
# Signing is deliberately OFF here. CI builds unsigned, and no developer account
# ever reaches the repository. Device builds get their team from
# scripts/device-build.sh, which passes DEVELOPMENT_TEAM on the xcodebuild
# command line. Never put a team into this file.
#
# The App Group and iCloud entitlements live HERE, for both the app and the
# widget target — capabilities set in Xcode's UI are discarded on the next
# regeneration, and a missing App Group fails silently.
name: RouteWarrior
options:
  bundleIdPrefix: com.lawtoncorp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RouteWarriorKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  RouteWarrior:
    type: application
    platform: iOS
    sources:
      - path: App/RouteWarrior
    dependencies:
      - package: RouteWarriorKit
        product: RouteWarriorKit
      - package: RouteWarriorKit
        product: RouteWarriorStore
      - target: RouteWarriorWidgets
        embed: true
    entitlements:
      path: App/RouteWarrior/RouteWarrior.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lawtoncorp.routewarrior
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lawtoncorp.routewarrior
    info:
      path: App/RouteWarrior/Info.plist
      properties:
        CFBundleDisplayName: Route Warrior
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: >-
          Route Warrior records the routes you drive so you can compare them
          against Google's plan. Location is used only for recording your
          drives.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Always-on access lets Route Warrior start recording automatically
          when you begin driving — no taps needed. Your location history
          stays on your device and in your private iCloud.
        NSMotionUsageDescription: >-
          Motion activity tells Route Warrior when a drive starts and ends,
          so recording is hands-free.
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lawtoncorp.routewarrior
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RouteWarriorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/RouteWarriorWidgets
    entitlements:
      path: App/RouteWarriorWidgets/RouteWarriorWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lawtoncorp.routewarrior
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lawtoncorp.routewarrior
    info:
      path: App/RouteWarriorWidgets/Info.plist
      properties:
        CFBundleDisplayName: Route Warrior
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lawtoncorp.routewarrior.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"

  RouteWarriorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/RouteWarriorTests
    dependencies:
      - target: RouteWarrior

schemes:
  RouteWarrior:
    build:
      targets:
        RouteWarrior: all
    test:
      targets:
        - RouteWarriorTests
